<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Gestionale</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>

<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="h4 mb-0 me-auto text-white text-decoration-none fw-bold">Gestionale</a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0">Dashboard</h2>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary bg-white btn-tondo" id="cerca"
                    title="Cerca" aria-label="Cerca" aria-expanded="false" aria-controls="pannelloFiltri">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
                </svg>
                <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-2 border-white rounded-circle"
                      id="pallinoFiltri" hidden><span class="visually-hidden">Filtri attivi</span></span>
            </button>
        </div>
    </div>

    <div class="card card-body shadow-sm border-0 mb-3" id="pannelloFiltri" hidden>
        <div class="row g-2 filtri">
            <div class="col-4">
                <select id="filtroCategoria" class="form-select vuoto" aria-label="Categoria">
                    <option value="">Categoria</option>
                </select>
            </div>
            <div class="col-4">
                <div class="campo-data">
                    <input type="date" id="dal" class="form-control vuoto" aria-label="Dal">
                    <span class="segnaposto" aria-hidden="true">Dal</span>
                </div>
            </div>
            <div class="col-4">
                <div class="campo-data">
                    <input type="date" id="al" class="form-control vuoto" aria-label="Al">
                    <span class="segnaposto" aria-hidden="true">Al</span>
                </div>
            </div>
        </div>
        <div class="text-end mt-2">
            <button type="button" class="btn btn-sm btn-light border" id="azzera">Azzera filtri</button>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-baseline px-1 mb-2" id="riepilogo"></div>

    <div class="position-relative" id="contenutoDashboard">
        <div class="position-absolute top-0 start-50 translate-middle-x mt-5 text-primary grafico-cerchietto" id="cerchiettoAggiornamento" hidden>
            <span class="spinner-border" aria-hidden="true"></span>
            <span class="visually-hidden">Aggiornamento...</span>
        </div>

        <div id="graficiCaricamento" class="card shadow-sm border-0">
            <div class="caricamento-elenco d-flex align-items-center gap-2 text-body-secondary p-3">
                <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                <span>Caricamento...</span>
            </div>
        </div>

        <p class="card card-body shadow-sm border-0 text-body-secondary mb-0" id="nessunDato" hidden></p>

        <div id="grafici" hidden>
            <div class="carosello" id="carosello" aria-roledescription="carosello" aria-label="Grafici">
                <div class="carosello-binario" tabindex="0">
                    <section class="carosello-slide card card-body shadow-sm border-0" aria-roledescription="slide" aria-label="1 di 2: Spese per data">
                        <h3 class="h5 fw-bold mb-0">Spese per data</h3>
                        <p class="small text-body-secondary mb-2" id="sottotitoloDate"></p>
                        <div class="grafico-barre">
                            <canvas id="graficoDate" role="img" aria-label="Grafico a barre delle spese per data"></canvas>
                        </div>
                        <details class="mt-2 small">
                            <summary class="text-body-secondary">Vedi i dati in tabella</summary>
                            <div class="table-responsive mt-2">
                                <table class="table table-sm mb-0">
                                    <thead><tr><th scope="col" id="intestazionePeriodo">Periodo</th><th scope="col" class="text-end">Speso</th></tr></thead>
                                    <tbody id="tabellaDate"></tbody>
                                </table>
                            </div>
                        </details>
                    </section>

                    <section class="carosello-slide card card-body shadow-sm border-0" aria-roledescription="slide" aria-label="2 di 2: Spese per categoria">
                        <h3 class="h5 fw-bold mb-3">Spese per categoria</h3>
                        <div class="row g-4 align-items-center flex-grow-1">
                            <div class="col-md-6">
                                <div class="grafico-torta mx-auto" id="contenitoreTorta">
                                    <canvas id="graficoCategorie" role="img" aria-label="Grafico a torta delle spese per categoria"></canvas>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <ul class="list-group list-group-flush" id="legendaCategorie"></ul>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="lib/chartjs/chart.umd.min.js"></script>
<script src="componenti.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
