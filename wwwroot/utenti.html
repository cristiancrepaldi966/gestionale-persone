<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utenti - Gestionale Uscite</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>
<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="h4 mb-0 me-auto text-white text-decoration-none fw-bold">Gestionale Uscite</a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0">Utenti</h2>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary bg-white btn-tondo" id="cerca"
                    title="Cerca" aria-label="Cerca" aria-expanded="false" aria-controls="pannelloFiltri">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
                </svg>
                <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-2 border-white rounded-circle"
                      id="pallinoFiltri" hidden><span class="visually-hidden">Filtri attivi</span></span>
            </button>
            <button type="button" class="btn btn-primary btn-tondo" id="nuova"
                    title="Nuovo utente" aria-label="Nuovo utente">+</button>
        </div>
    </div>

    <div class="card card-body shadow-sm border-0 mb-3" id="pannelloFiltri" hidden>
        <div class="row g-2 filtri">
            <div class="col-6 col-sm-3">
                <select id="filtroRuolo" class="form-select vuoto" aria-label="Ruolo">
                    <option value="">Ruolo</option>
                    <option value="admin">Amministratori</option>
                    <option value="utente">Utenti</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 order-last order-sm-0">
                <input type="search" id="filtroTesto" class="form-control" placeholder="Nome, cognome o email"
                       aria-label="Cerca per nome, cognome o email" enterkeyhint="search">
            </div>
            <div class="col-6 col-sm-3">
                <select id="filtroStato" class="form-select vuoto" aria-label="Stato">
                    <option value="">Stato</option>
                    <option value="attivi">Attivi</option>
                    <option value="disattivati">Disattivati</option>
                    <option value="bloccati">Bloccati</option>
                </select>
            </div>
        </div>
        <div class="text-end mt-2">
            <button type="button" class="btn btn-sm btn-light border" id="azzera">Azzera filtri</button>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-baseline px-1 mb-2" id="riepilogo"></div>

    <div class="card shadow-sm border-0">
        <div class="list-group list-group-flush rounded" id="listaUtenti">
            <div class="caricamento-elenco d-flex align-items-center gap-2 text-body-secondary p-3">
                <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                <span>Caricamento...</span>
            </div>
        </div>
    </div>

</main>

<dialog id="finestra" class="finestra">
    <form method="dialog" id="formUtente" novalidate>
        <h2 class="h4 fw-bold mb-3" tabindex="-1" autofocus>Nuovo utente</h2>

        <div class="row g-3">
            <div class="col-12">
                <label for="ruolo" class="form-label fw-semibold">Ruolo</label>
                <select id="ruolo" class="form-select" aria-describedby="aiutoRuolo">
                    <option value="utente">Utente</option>
                    <option value="admin">Amministratore</option>
                </select>
                <div class="form-text" id="aiutoRuolo">L'utente gestisce le uscite; l'amministratore anche utenti e categorie.</div>
            </div>

            <div class="col-6">
                <label for="nome" class="form-label fw-semibold">Nome</label>
                <input type="text" id="nome" class="form-control" maxlength="100" autocomplete="off">
            </div>

            <div class="col-6">
                <label for="cognome" class="form-label fw-semibold">Cognome</label>
                <input type="text" id="cognome" class="form-control" maxlength="100" autocomplete="off">
            </div>

            <div class="col-12">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" id="email" class="form-control" autocomplete="off">
            </div>

            <div class="col-12">
                <label for="password" class="form-label fw-semibold" id="etichettaPassword">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="new-password">
                <div class="form-text" id="aiutoPassword">Almeno 8 caratteri.</div>
            </div>

            <div class="col-12">
                <div class="form-check" id="rigaAttivo">
                    <input class="form-check-input" type="checkbox" id="attivo">
                    <label class="form-check-label" for="attivo">Attivo (può accedere)</label>
                </div>
                <div class="form-text" id="aiutoSeStesso" hidden>Non puoi togliere a te stesso i permessi di amministratore o disattivarti.</div>
            </div>
        </div>

        <div id="erroreFinestra" class="small mt-2 text-danger"></div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light" id="annulla">Annulla</button>
            <button type="submit" class="btn btn-primary px-4">Salva</button>
        </div>
    </form>
</dialog>

<script src="componenti.js"></script>
<script src="js/utenti.js"></script>

</body>
</html>
