<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utenti - Gestionale Uscite</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>
<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="h4 mb-0 me-auto text-white text-decoration-none fw-bold">Gestionale Uscite</a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto py-4">

    <div class="card card-body shadow-sm border-0 mb-3">
        <h2 class="h5 fw-bold">Nuovo utente</h2>

        <form id="formNuovo" novalidate>
            <div class="row g-2">
                <div class="col-sm-6">
                    <input type="email" id="email" class="form-control" placeholder="Email"
                           aria-label="Email" autocomplete="off">
                </div>
                <div class="col-sm-6">
                    <input type="password" id="password" class="form-control"
                           placeholder="Password (almeno 8 caratteri)" aria-label="Password"
                           autocomplete="new-password">
                </div>
            </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" id="isAdmin">
                    <label class="form-check-label" for="isAdmin">Amministratore (può gestire gli utenti)</label>
                </div>
                <button type="submit" class="btn btn-primary">Crea utente</button>
            </div>
        </form>

        <div id="messaggio"></div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body pb-0">
            <h2 class="h5 fw-bold mb-0">Utenti</h2>
        </div>
        <div class="list-group list-group-flush rounded" id="listaUtenti">
            <div class="caricamento-elenco d-flex align-items-center gap-2 text-body-secondary p-3">
                <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                <span>Caricamento...</span>
            </div>
        </div>
    </div>

</main>

<script src="componenti.js"></script>
<script src="js/utenti.js"></script>

</body>
</html>
