<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politici - Fantapolitica</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="lib/bootstrap-icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>
<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="casa me-auto link-light link-opacity-75 link-opacity-100-hover" title="Pagina di ingresso" aria-label="Pagina di ingresso"><i class="bi bi-house-door" aria-hidden="true"></i></a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0">Politici</h2>
        <button type="button" class="btn btn-primary btn-tondo" id="nuovo"
                title="Nuovo politico" aria-label="Nuovo politico">+</button>
    </div>

    <form class="card card-body shadow-sm border-0 mb-3" id="formImpostazioni" novalidate>
        <div class="d-flex flex-wrap align-items-end gap-2">
            <div>
                <label for="creditiPerSquadra" class="form-label fw-semibold mb-1">Crediti per squadra</label>
                <div class="input-group">
                    <input type="number" id="creditiPerSquadra" class="form-control campo-crediti" min="1" max="10000" step="1" inputmode="numeric">
                    <span class="input-group-text">crediti</span>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Salva</button>
        </div>
        <div class="small text-body-secondary mt-2" id="spiegazioneCrediti">Ogni giocatore compra i suoi politici spendendo al massimo questi crediti.</div>
        <div id="messaggioImpostazioni" class="small"></div>
    </form>

    <div class="px-1 mb-2 text-body-secondary" id="riepilogo"></div>

    <div class="card shadow-sm border-0">
        <div class="list-group list-group-flush rounded" id="listaPolitici">
            <div class="caricamento-elenco d-flex align-items-center gap-2 text-body-secondary p-3">
                <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                <span>Caricamento...</span>
            </div>
        </div>
    </div>

</main>

<dialog id="finestra" class="finestra">
    <form method="dialog" id="formPolitico" novalidate>
        <h2 class="h4 fw-bold mb-3" tabindex="-1" autofocus>Nuovo politico</h2>

        <div class="row g-3">
            <div class="col-sm-6">
                <label for="nome" class="form-label fw-semibold">Nome</label>
                <input type="text" id="nome" class="form-control" maxlength="100" autocomplete="off">
            </div>
            <div class="col-sm-6">
                <label for="cognome" class="form-label fw-semibold">Cognome</label>
                <input type="text" id="cognome" class="form-control" maxlength="100" autocomplete="off">
            </div>
            <div class="col-sm-6">
                <label for="ruolo" class="form-label fw-semibold">Ruolo</label>
                <select id="ruolo" class="form-select">
                    <option>Sindaco</option>
                    <option>Vicesindaco</option>
                    <option>Assessore</option>
                    <option selected>Consigliere</option>
                </select>
            </div>
            <div class="col-sm-6">
                <label for="partito" class="form-label fw-semibold">Partito o lista <span class="fw-normal text-body-secondary">(facoltativo)</span></label>
                <input type="text" id="partito" class="form-control" maxlength="100" autocomplete="off">
            </div>
            <div class="col-sm-6">
                <label for="costo" class="form-label fw-semibold">Costo</label>
                <div class="input-group">
                    <input type="number" id="costo" class="form-control" min="0" max="10000" step="1" inputmode="numeric">
                    <span class="input-group-text">crediti</span>
                </div>
            </div>
        </div>

        <div id="erroreFinestra" class="small mt-2 text-danger"></div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light" id="annulla">Annulla</button>
            <button type="submit" class="btn btn-primary px-4">Salva</button>
        </div>
    </form>
</dialog>

<script src="componenti.js"></script>
<script src="js/fantapolitica-comune.js"></script>
<script src="js/fantapolitica-politici.js"></script>

</body>
</html>
