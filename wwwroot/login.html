<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso - Gestionale</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>
<body>

<header class="d-flex align-items-center px-3 py-3 bg-dark" data-bs-theme="dark">
    <span class="h4 mb-0 text-white fw-bold">Gestionale</span>
</header>

<main class="container contenuto-stretto py-5">
    <form class="card card-body shadow-sm border-0 p-4" id="form" novalidate>
        <h2 class="h4 fw-bold mb-3">Accedi</h2>

        <input type="email" id="email" class="form-control mb-3" placeholder="Email"
               aria-label="Email" autocomplete="username" autofocus>
        <input type="password" id="password" class="form-control mb-3" placeholder="Password"
               aria-label="Password" autocomplete="current-password">

        <button type="submit" class="btn btn-primary w-100" id="entra">Entra</button>

        <div id="messaggio"></div>
    </form>
</main>

<script src="componenti.js"></script>
<script src="js/login.js"></script>

</body>
</html>
