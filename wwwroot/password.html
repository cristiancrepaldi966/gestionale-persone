<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambia password - Gestionale Uscite</title>
    <link rel="stylesheet" href="stile.css">
</head>
<body class="in-attesa">

<header>
    <h1><a href="/" style="text-decoration:none">Gestionale Uscite</a></h1>
    <nav class="barra-utente" id="barraUtente"></nav>
</header>

<main>
    <form class="card accesso" id="form">
        <h2>Cambia password</h2>

        <input type="password" id="attuale" placeholder="Password attuale" autocomplete="current-password" required>
        <input type="password" id="nuova" placeholder="Nuova password (almeno 8 caratteri)" autocomplete="new-password" minlength="8" required>
        <input type="password" id="conferma" placeholder="Ripeti la nuova password" autocomplete="new-password" minlength="8" required>

        <button type="submit" class="btn-primary">Salva</button>

        <div id="messaggio" class="errore"></div>
    </form>
</main>

<script src="app.js"></script>
<script>

    avviaPagina();

    document.getElementById("form").addEventListener("submit", async e => {

        e.preventDefault();

        const messaggio = document.getElementById("messaggio");
        const nuova = document.getElementById("nuova").value;

        if (nuova !== document.getElementById("conferma").value) {
            messaggio.textContent = "Le due password nuove non coincidono.";
            return;
        }

        try {

            const response = await api("/api/auth/password", jsonBody("POST", {
                passwordAttuale: document.getElementById("attuale").value,
                nuovaPassword: nuova
            }));

            if (!response.ok) {
                messaggio.textContent = await messaggioErrore(response, "Errore durante il cambio password.");
                return;
            }

            alert("Password cambiata. Accedi di nuovo con la nuova password.");
            location.href = "/login.html";

        } catch {
            if (!messaggio.textContent) messaggio.textContent = "Errore nel collegamento al server.";
        }
    });

</script>

</body>
</html>
