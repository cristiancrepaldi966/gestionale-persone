<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambia password - Gestionale Uscite</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>
<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="h4 mb-0 me-auto text-white text-decoration-none fw-bold">Gestionale Uscite</a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto-stretto py-5">
    <form class="card card-body shadow-sm border-0 p-4" id="form" novalidate>
        <h2 class="h4 fw-bold mb-3">Cambia password</h2>

        <input type="password" id="attuale" class="form-control mb-3" placeholder="Password attuale"
               aria-label="Password attuale" autocomplete="current-password">
        <input type="password" id="nuova" class="form-control mb-3"
               placeholder="Nuova password (almeno 8 caratteri)" aria-label="Nuova password"
               autocomplete="new-password">
        <input type="password" id="conferma" class="form-control mb-3"
               placeholder="Ripeti la nuova password" aria-label="Ripeti la nuova password"
               autocomplete="new-password">

        <button type="submit" class="btn btn-primary w-100">Salva</button>

        <div id="messaggio"></div>
    </form>
</main>

<script src="componenti.js"></script>
<script>

    avviaPagina();

    alInvio(document.getElementById("form"), async () => {

        const messaggio = document.getElementById("messaggio");
        const attuale = document.getElementById("attuale").value;
        const nuova = document.getElementById("nuova").value;

        if (!attuale) {
            mostraMessaggio(messaggio, "Inserisci la password attuale.");
            return;
        }

        if (nuova.length < 8) {
            mostraMessaggio(messaggio, "La nuova password deve avere almeno 8 caratteri.");
            return;
        }

        if (nuova !== document.getElementById("conferma").value) {
            mostraMessaggio(messaggio, "Le due password nuove non coincidono.");
            return;
        }

        try {

            const response = await api("/api/auth/password", jsonBody("POST", {
                passwordAttuale: attuale,
                nuovaPassword: nuova
            }));

            if (!response.ok) {
                mostraMessaggio(messaggio, await messaggioErrore(response, "Errore durante il cambio password."));
                return;
            }

            alert("Password cambiata. Accedi di nuovo con la nuova password.");
            location.href = "/login.html";

        } catch {
            if (!messaggio.textContent) mostraMessaggio(messaggio, "Errore nel collegamento al server.");
        }
    });

</script>

</body>
</html>
