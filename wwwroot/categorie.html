<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorie - Gestionale Uscite</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>
<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="h4 mb-0 me-auto text-white text-decoration-none fw-bold">Gestionale Uscite</a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto py-4">

    <div class="card card-body shadow-sm border-0 mb-3">
        <h2 class="h5 fw-bold">Nuova categoria</h2>

        <form class="d-flex gap-2" id="formNuova" novalidate>
            <input type="text" id="nome" class="form-control" maxlength="50"
                   placeholder="Nome della categoria" aria-label="Nome della categoria">
            <button type="submit" class="btn btn-primary text-nowrap">Aggiungi</button>
        </form>

        <div id="messaggio"></div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body pb-0">
            <h2 class="h5 fw-bold mb-0">Categorie</h2>
        </div>
        <div class="list-group list-group-flush rounded" id="listaCategorie">
            <div class="caricamento-elenco d-flex align-items-center gap-2 text-body-secondary p-3">
                <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                <span>Caricamento...</span>
            </div>
        </div>
    </div>

</main>

<script src="componenti.js"></script>
<script src="js/categorie.js"></script>

</body>
</html>
