<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uscite - Gestionale Uscite</title>
    <link rel="stylesheet" href="stile.css">
</head>

<body class="in-attesa">

<header>
    <h1><a href="/" style="text-decoration:none">Gestionale Uscite</a></h1>
    <nav class="barra-utente" id="barraUtente"></nav>
</header>

<main>

    <div class="titolo-pagina">
        <h2>Uscite</h2>
        <button type="button" class="btn-aggiungi" id="nuova" title="Nuova uscita" aria-label="Nuova uscita">+</button>
    </div>

    <div class="card">
        <div class="filtri">
            <input type="search" id="q" placeholder="Cerca nella descrizione o nelle note" class="filtro-testo">
            <select id="filtroCategoria" aria-label="Categoria">
                <option value="">Tutte le categorie</option>
            </select>
            <label class="data">Dal <input type="date" id="dal"></label>
            <label class="data">Al <input type="date" id="al"></label>
            <button type="button" class="btn-secondary" id="azzera">Azzera</button>
        </div>
    </div>

    <div class="riepilogo" id="riepilogo"></div>

    <div class="card">
        <div id="listaUscite">Caricamento...</div>
    </div>

</main>

<dialog id="finestra">
    <form method="dialog" id="formUscita">
        <h2 id="titoloFinestra">Nuova uscita</h2>

        <div class="griglia-form">
            <label>Data
                <input type="date" id="data" required>
            </label>

            <label>Importo (€)
                <input type="text" id="importo" inputmode="decimal" placeholder="0,00" required>
            </label>

            <label class="intera">Descrizione
                <input type="text" id="descrizione" maxlength="200" required>
            </label>

            <label class="intera">Categoria
                <select id="categoria" required></select>
            </label>

            <label class="intera">Note (facoltative)
                <textarea id="note" maxlength="1000" rows="3"></textarea>
            </label>
        </div>

        <div id="erroreFinestra" class="errore"></div>

        <div class="azioni-finestra">
            <button type="button" class="btn-secondary" id="annulla">Annulla</button>
            <button type="submit" class="btn-primary" id="salva">Salva</button>
        </div>
    </form>
</dialog>

<script src="app.js"></script>
<script>

    const API = "/api/uscite";
    let categorie = [];
    let inModifica = null; // uscita in modifica, null se è nuova

    const euro = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR", useGrouping: "always" });

    const formatoData = iso => {
        const [a, m, g] = iso.split("-");
        return `${g}/${m}/${a}`;
    };

    const oggi = () => {
        const d = new Date();
        d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
        return d.toISOString().slice(0, 10);
    };

    // Accetta "12,50", "12.50", "1.234,56", "€ 12".
    function leggiImporto(testo) {
        let t = testo.replace(/[€\s]/g, "");
        if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
        if (!/^\d+(\.\d{1,2})?$/.test(t)) return null;
        const n = Number(t);
        return n > 0 ? n : null;
    }

    async function caricaCategorie() {
        const response = await api("/api/categorie");
        categorie = await response.json();

        const filtro = document.getElementById("filtroCategoria");
        const scelta = filtro.value;
        filtro.replaceChildren(new Option("Tutte le categorie", ""),
            ...categorie.map(c => new Option(c.nome, c.id)));
        filtro.value = scelta;

        document.getElementById("categoria").replaceChildren(
            new Option("Scegli una categoria", ""),
            ...categorie.map(c => new Option(c.nome, c.id)));
    }

    function parametriRicerca() {
        const p = new URLSearchParams();
        const valore = id => document.getElementById(id).value.trim();
        if (valore("q")) p.set("q", valore("q"));
        if (valore("filtroCategoria")) p.set("categoriaId", valore("filtroCategoria"));
        if (valore("dal")) p.set("dal", valore("dal"));
        if (valore("al")) p.set("al", valore("al"));
        return p;
    }

    let richiestaCorrente = 0;

    async function caricaUscite() {

        const lista = document.getElementById("listaUscite");
        const riepilogo = document.getElementById("riepilogo");
        const numeroRichiesta = ++richiestaCorrente;

        try {
            const response = await api(`${API}?${parametriRicerca()}`);
            if (!response.ok) throw new Error();
            const r = await response.json();

            // Ignora risposte arrivate in ritardo rispetto a una ricerca più recente.
            if (numeroRichiesta !== richiestaCorrente) return;

            riepilogo.replaceChildren(
                el("span", null, `${r.numero} ${r.numero === 1 ? "uscita" : "uscite"}`),
                el("strong", null, `Totale ${euro.format(r.totale)}`));

            if (r.uscite.length === 0) {
                const filtrato = parametriRicerca().toString() !== "";
                lista.replaceChildren(el("p", null, filtrato
                    ? "Nessuna uscita corrisponde alla ricerca."
                    : "Nessuna uscita inserita. Usa il pulsante + in alto a destra."));
                return;
            }

            lista.replaceChildren(...r.uscite.map(rigaUscita));

            if (r.troncato) {
                lista.appendChild(el("p", "nota",
                    `Mostrate le ${r.uscite.length} più recenti: restringi la ricerca per vedere le altre. Il totale è calcolato su tutte.`));
            }

        } catch {
            if (numeroRichiesta === richiestaCorrente) {
                lista.replaceChildren(el("p", "errore", "Errore nel caricamento delle uscite."));
            }
        }
    }

    function rigaUscita(u) {

        const riga = el("div", "uscita");

        const info = el("div", "uscita-info");
        const titolo = el("div", "nome", u.descrizione);
        info.appendChild(titolo);

        const dettagli = el("div", "uscita-dettagli");
        dettagli.append(
            el("span", null, formatoData(u.data)),
            el("span", "etichetta", u.categoria));
        if (u.creatoDa) dettagli.appendChild(el("span", "nota", u.creatoDa));
        info.appendChild(dettagli);

        if (u.note) info.appendChild(el("div", "nota", u.note));

        const destra = el("div", "uscita-destra");
        destra.appendChild(el("div", "importo", euro.format(u.importo)));

        const azioni = el("div", "azioni");
        azioni.appendChild(pulsante("Modifica", "btn-secondary btn-piccolo", () => apriFinestra(u)));
        azioni.appendChild(pulsante("Elimina", "btn-danger btn-piccolo", () => eliminaUscita(u)));
        destra.appendChild(azioni);

        riga.append(info, destra);
        return riga;
    }

    function apriFinestra(u) {

        inModifica = u || null;

        document.getElementById("titoloFinestra").textContent = u ? "Modifica uscita" : "Nuova uscita";
        document.getElementById("data").value = u ? u.data : oggi();
        document.getElementById("importo").value = u ? u.importo.toFixed(2).replace(".", ",") : "";
        document.getElementById("descrizione").value = u ? u.descrizione : "";
        document.getElementById("categoria").value = u ? u.categoriaId : "";
        document.getElementById("note").value = u && u.note ? u.note : "";
        document.getElementById("erroreFinestra").textContent = "";

        const finestra = document.getElementById("finestra");
        finestra.showModal();
        document.getElementById(u ? "descrizione" : "importo").focus();
    }

    function chiudiFinestra() {
        document.getElementById("finestra").close();
    }

    async function salvaUscita(e) {

        e.preventDefault();

        const errore = document.getElementById("erroreFinestra");
        const importo = leggiImporto(document.getElementById("importo").value);

        if (importo === null) {
            errore.textContent = "Inserisci un importo valido maggiore di zero (es. 12,50).";
            return;
        }

        const categoriaId = Number(document.getElementById("categoria").value);
        if (!categoriaId) {
            errore.textContent = "Scegli una categoria.";
            return;
        }

        const dati = {
            data: document.getElementById("data").value,
            importo,
            descrizione: document.getElementById("descrizione").value.trim(),
            categoriaId,
            note: document.getElementById("note").value.trim() || null
        };

        if (!dati.data || !dati.descrizione) {
            errore.textContent = "Inserisci data e descrizione.";
            return;
        }

        const bottone = document.getElementById("salva");
        bottone.disabled = true;

        try {
            const response = inModifica
                ? await api(`${API}/${inModifica.id}`, jsonBody("PUT", dati))
                : await api(API, jsonBody("POST", dati));

            if (!response.ok) {
                errore.textContent = await messaggioErrore(response, "Errore durante il salvataggio.");
                return;
            }

            chiudiFinestra();
            await caricaUscite();

        } catch {
            errore.textContent = "Errore nel collegamento al server.";
        } finally {
            bottone.disabled = false;
        }
    }

    async function eliminaUscita(u) {

        if (!confirm(`Eliminare l'uscita "${u.descrizione}" di ${euro.format(u.importo)}?`)) return;

        try {
            const response = await api(`${API}/${u.id}`, { method: "DELETE" });
            if (!response.ok) throw new Error();
            await caricaUscite();
        } catch {
            alert("Errore durante l'eliminazione.");
        }
    }

    // Ricerca mentre si scrive (con una breve attesa) e al cambio dei filtri.
    let attesa;
    document.getElementById("q").addEventListener("input", () => {
        clearTimeout(attesa);
        attesa = setTimeout(caricaUscite, 300);
    });
    ["filtroCategoria", "dal", "al"].forEach(id =>
        document.getElementById(id).addEventListener("change", caricaUscite));

    document.getElementById("azzera").addEventListener("click", () => {
        ["q", "filtroCategoria", "dal", "al"].forEach(id => document.getElementById(id).value = "");
        caricaUscite();
    });

    document.getElementById("nuova").addEventListener("click", () => apriFinestra(null));
    document.getElementById("annulla").addEventListener("click", chiudiFinestra);
    document.getElementById("formUscita").addEventListener("submit", salvaUscita);

    avviaPagina()
        .then(caricaCategorie)
        .then(caricaUscite)
        .catch(() => {
            document.getElementById("listaUscite").replaceChildren(
                el("p", "errore", "Errore nel collegamento al server."));
        });

</script>

</body>
</html>
