<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uscite - Gestionale Uscite</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="componenti.css">
</head>

<body class="in-attesa">

<header class="d-flex flex-wrap align-items-center gap-2 px-3 py-3 bg-dark" data-bs-theme="dark">
    <a href="/" class="h4 mb-0 me-auto text-white text-decoration-none fw-bold">Gestionale Uscite</a>
    <div class="barra-utente" id="barraUtente"></div>
</header>

<main class="container contenuto py-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3 fw-bold mb-0">Uscite</h2>
        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary bg-white btn-tondo" id="cerca"
                    title="Cerca" aria-label="Cerca" aria-expanded="false" aria-controls="pannelloFiltri">
                <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none"
                     stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
                </svg>
                <span class="position-absolute top-0 start-100 translate-middle p-2 bg-danger border border-2 border-white rounded-circle"
                      id="pallinoFiltri" hidden><span class="visually-hidden">Filtri attivi</span></span>
            </button>
            <button type="button" class="btn btn-primary btn-tondo" id="nuova"
                    title="Nuova uscita" aria-label="Nuova uscita">+</button>
        </div>
    </div>

    <div class="card card-body shadow-sm border-0 mb-3" id="pannelloFiltri" hidden>
        <div class="row g-2 filtri">
            <div class="col-4">
                <select id="filtroCategoria" class="form-select vuoto" aria-label="Categoria">
                    <option value="">Categoria</option>
                </select>
            </div>
            <div class="col-4 campo-data">
                <input type="date" id="dal" class="form-control vuoto" aria-label="Dal">
                <span class="segnaposto" aria-hidden="true">Dal</span>
            </div>
            <div class="col-4 campo-data">
                <input type="date" id="al" class="form-control vuoto" aria-label="Al">
                <span class="segnaposto" aria-hidden="true">Al</span>
            </div>
        </div>
        <div class="text-end mt-2">
            <button type="button" class="btn btn-link btn-sm p-0" id="azzera">Azzera filtri</button>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-baseline px-1 mb-2" id="riepilogo"></div>

    <div class="card shadow-sm border-0 position-relative">
        <div class="position-absolute top-0 start-50 translate-middle-x mt-3 text-primary" id="cerchiettoAggiornamento" hidden>
            <span class="spinner-border" aria-hidden="true"></span>
            <span class="visually-hidden">Aggiornamento...</span>
        </div>
        <div class="list-group list-group-flush rounded" id="listaUscite">
            <div class="caricamento-elenco d-flex align-items-center gap-2 text-body-secondary p-3">
                <span class="spinner-border spinner-border-sm text-primary" aria-hidden="true"></span>
                <span>Caricamento...</span>
            </div>
        </div>
    </div>

</main>

<dialog id="finestra" class="finestra">
    <form method="dialog" id="formUscita" novalidate>
        <h2 id="titoloFinestra" class="h4 fw-bold mb-3" tabindex="-1" autofocus>Nuova uscita</h2>

        <div class="row g-3">
            <div class="col-6">
                <label for="data" class="form-label fw-semibold">Data</label>
                <input type="date" id="data" class="form-control">
            </div>

            <div class="col-6">
                <label for="importo" class="form-label fw-semibold">Importo (€)</label>
                <input type="text" id="importo" class="form-control" inputmode="decimal" placeholder="0,00">
            </div>

            <div class="col-12">
                <label for="categoria" class="form-label fw-semibold">Categoria</label>
                <select id="categoria" class="form-select"></select>
            </div>

            <div class="col-12">
                <label for="note" class="form-label fw-semibold">Note <span class="fw-normal text-body-secondary">(facoltative)</span></label>
                <textarea id="note" class="form-control" maxlength="1000" rows="3"></textarea>
            </div>
        </div>

        <div id="erroreFinestra" class="small mt-2 text-danger"></div>

        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-light" id="annulla">Annulla</button>
            <button type="submit" class="btn btn-primary px-4" id="salva">Salva</button>
        </div>
    </form>
</dialog>

<script src="componenti.js"></script>
<script src="js/index.js"></script>

</body>
</html>
