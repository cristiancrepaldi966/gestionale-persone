<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestionale Persone</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 200px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #111;
        }

        .errore {
            color: #dc2626;
        }

        .successo {
            color: #16a34a;
        }

        .modifica {
            flex: 1;
        }

        .modifica .errore {
            margin-top: 8px;
        }

        .persona {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .persona:last-child {
            border-bottom: none;
        }

        .nome {
            font-size: 18px;
            font-weight: bold;
        }

        .azioni {
            display: flex;
            gap: 8px;
        }

        #messaggio {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .persona {
                flex-direction: column;
                align-items: flex-start;
            }

            .azioni,
            .modifica {
                width: 100%;
            }

            .azioni button {
                flex: 1;
            }

            input {
                width: 100%;
                min-width: 100%;
            }

            .btn-primary {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Gestionale Persone</h1>
</header>

<main>

    <div class="card">
        <h2>Inserisci persona</h2>

        <div class="form-row">
            <input
                type="text"
                id="nome"
                maxlength="100"
                placeholder="Nome">

            <input
                type="text"
                id="cognome"
                maxlength="100"
                placeholder="Cognome">

            <button
                type="button"
                class="btn-primary"
                id="aggiungi">
                Aggiungi
            </button>
        </div>

        <div id="messaggio"></div>
    </div>

    <div class="card">
        <h2>Persone</h2>

        <div id="listaPersone">
            Caricamento...
        </div>
    </div>

</main>

<script>

    const API_URL = "/api/persone";

    // Crea un elemento con classe e testo (il testo NON viene interpretato come HTML).
    function el(tag, className, text) {
        const e = document.createElement(tag);
        if (className) e.className = className;
        if (text !== undefined) e.textContent = text;
        return e;
    }

    function pulsante(testo, className, onClick) {
        const b = el("button", className, testo);
        b.type = "button";
        b.addEventListener("click", onClick);
        return b;
    }

    // Estrae un messaggio leggibile dalla risposta di errore dell'API.
    async function messaggioErrore(response, predefinito) {
        try {
            const dati = await response.json();
            if (dati && dati.errors) {
                return Object.values(dati.errors).flat().join(" ");
            }
        } catch { }
        return predefinito;
    }

    function mostraMessaggio(testo, errore) {
        const messaggio = document.getElementById("messaggio");
        messaggio.textContent = testo;
        messaggio.className = errore ? "errore" : "successo";
    }

    async function caricaPersone() {

        const lista = document.getElementById("listaPersone");

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Errore nel caricamento");
            }

            const persone = await response.json();

            lista.replaceChildren();

            if (persone.length === 0) {
                lista.appendChild(el("p", null, "Nessuna persona presente."));
                return;
            }

            persone.forEach(persona => lista.appendChild(rigaPersona(persona)));

        } catch (error) {

            lista.replaceChildren(el("p", "errore", "Errore nel collegamento al server."));
        }
    }

    function rigaPersona(persona) {

        const div = el("div", "persona");

        const info = el("div");
        info.appendChild(el("div", "nome", `${persona.nome} ${persona.cognome}`));
        info.appendChild(el("small", null, `ID: ${persona.id}`));

        const azioni = el("div", "azioni");
        azioni.appendChild(pulsante("Modifica", "btn-secondary", () => modificaPersona(div, persona)));
        azioni.appendChild(pulsante("Elimina", "btn-danger", () => eliminaPersona(persona.id)));

        div.append(info, azioni);
        return div;
    }

    function modificaPersona(div, persona) {

        const inputNome = el("input");
        inputNome.value = persona.nome;
        inputNome.placeholder = "Nome";
        inputNome.maxLength = 100;

        const inputCognome = el("input");
        inputCognome.value = persona.cognome;
        inputCognome.placeholder = "Cognome";
        inputCognome.maxLength = 100;

        const errore = el("div", "errore");

        const form = el("div", "form-row");
        form.append(inputNome, inputCognome);

        const salva = async () => {

            const nome = inputNome.value.trim();
            const cognome = inputCognome.value.trim();

            if (!nome || !cognome) {
                errore.textContent = "Inserisci nome e cognome.";
                return;
            }

            try {

                const response = await fetch(`${API_URL}/${persona.id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: persona.id, nome, cognome })
                });

                if (!response.ok) {
                    errore.textContent = await messaggioErrore(response, "Errore durante il salvataggio.");
                    return;
                }

                await caricaPersone();

            } catch {
                errore.textContent = "Errore nel collegamento al server.";
            }
        };

        const tastiera = e => {
            if (e.key === "Enter") salva();
            if (e.key === "Escape") div.replaceWith(rigaPersona(persona));
        };
        inputNome.addEventListener("keydown", tastiera);
        inputCognome.addEventListener("keydown", tastiera);

        const azioni = el("div", "azioni");
        azioni.appendChild(pulsante("Salva", "btn-primary", salva));
        azioni.appendChild(pulsante("Annulla", "btn-secondary", () => div.replaceWith(rigaPersona(persona))));

        const contenitore = el("div", "modifica");
        contenitore.append(form, errore);

        div.replaceChildren(contenitore, azioni);
        inputNome.focus();
    }


    async function aggiungiPersona() {

        const nome =
            document.getElementById("nome").value.trim();

        const cognome =
            document.getElementById("cognome").value.trim();

        if (!nome || !cognome) {
            mostraMessaggio("Inserisci nome e cognome.", true);
            return;
        }

        try {

            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ nome, cognome })
            });

            if (!response.ok) {
                mostraMessaggio(await messaggioErrore(response, "Errore durante l'inserimento."), true);
                return;
            }

            document.getElementById("nome").value = "";
            document.getElementById("cognome").value = "";
            document.getElementById("nome").focus();

            mostraMessaggio("Persona inserita correttamente.", false);

            await caricaPersone();

        } catch (error) {

            mostraMessaggio("Errore nel collegamento al server.", true);
        }
    }


    async function eliminaPersona(id) {

        if (!confirm("Vuoi eliminare questa persona?")) {
            return;
        }

        try {

            const response = await fetch(`${API_URL}/${id}`, { method: "DELETE" });

            if (!response.ok) {
                throw new Error();
            }

            await caricaPersone();

        } catch (error) {

            alert("Errore durante l'eliminazione.");
        }
    }


    document.getElementById("aggiungi").addEventListener("click", aggiungiPersona);

    ["nome", "cognome"].forEach(id =>
        document.getElementById(id).addEventListener("keydown", e => {
            if (e.key === "Enter") aggiungiPersona();
        }));

    caricaPersone();

</script>

</body>
</html>
