# Avvio locale: docker compose up --build  →  http://localhost:8080
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gestionale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestionale"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=gestionale;Username=postgres;Password=postgres"
    ports:
      - "8080:10000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
